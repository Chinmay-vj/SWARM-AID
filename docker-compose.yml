# Optional local PostgreSQL + PostGIS for SWARM-AID. Not required: SQLite works for development.
# Usage: set POSTGRES_PASSWORD in .env, then `docker compose up -d`.
# The image (postgis/postgis:16-3.4, roughly 400 MB) is downloaded on first start.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: swarm_aid
      POSTGRES_USER: swarm_aid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"  # localhost only
    volumes:
      - swarm_aid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm_aid -d swarm_aid"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  swarm_aid_pgdata:
