[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-aid"
version = "0.1.0"
description = "Simulation research contracts for civilian disaster search and rescue"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]
simulation = ["numpy", "pettingzoo", "gymnasium", "pygame"]
backend = ["fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]", "geoalchemy2"]
ml = []

[tool.setuptools.packages.find]
include = ["agents*", "communication*", "interfaces*", "configs*", "simulation*", "evaluation*"]
namespaces = false

[tool.setuptools.package-data]
configs = ["*.toml", "scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".tools"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["agents", "communication", "interfaces", "configs", "simulation", "evaluation", "tests"]
