[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-aid"
version = "0.1.0"
description = "Simulation research contracts for civilian disaster search and rescue"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2", "httpx>=0.27,<1"]
simulation = ["numpy", "pettingzoo", "gymnasium", "pygame"]
backend = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2,<4",
    "geoalchemy2>=0.15,<1",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.4,<3",
    "pyjwt>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "httpx>=0.27,<1",
]
ml = []
datasets = ["duckdb==1.4.2", "Pillow>=10", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = [
    "agents*", "communication*", "interfaces*", "configs*", "simulation*", "evaluation*", "backend*",
    "orchestration*",
]
namespaces = false

[tool.setuptools.package-data]
configs = ["*.toml","*.json", "scenarios/*.json", "datasets/*.json", "datasets/schemas/*.json"]

[tool.pytest.ini_options]
# Windows users sharing a checkout can have incompatible cache directory ACLs.
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".tools"]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "agents", "communication", "interfaces", "configs", "simulation", "evaluation", "backend", "migrations",
    "orchestration", "tests",
]
